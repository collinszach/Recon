<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Recon Autofill Settings</title>
  <style>
    body { font: 14px/1.5 -apple-system, sans-serif; max-width: 560px; margin: 24px auto; color: #222; }
    h1 { font-size: 18px; }
    h2 { font-size: 14px; color: #555; margin-top: 28px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    .row { display: grid; grid-template-columns: 180px 1fr; gap: 10px; align-items: center; margin: 8px 0; }
    label { font-size: 12px; color: #555; }
    input[type=text] { padding: 6px 8px; font-size: 13px; box-sizing: border-box; }
    input[type=checkbox] { justify-self: start; }
    button { padding: 8px 16px; font-size: 13px; cursor: pointer; background: #6c5ce7; color: #fff;
      border: none; border-radius: 6px; margin-top: 20px; }
    #saveStatus { font-size: 12px; margin-left: 10px; color: #1a7f4b; }
  </style>
</head>
<body>
  <h1>Recon Autofill — Settings</h1>

  <h2>Connection</h2>
  <div class="row"><label>Recon API base URL</label>
    <input type="text" id="apiBase" placeholder="http://100.91.198.28:8010"></div>

  <h2>Contact</h2>
  <div class="row"><label>Phone</label><input type="text" id="phone"></div>
  <div class="row"><label>Email</label><input type="text" id="email"></div>
  <div class="row"><label>Address line 1</label><input type="text" id="address_line1"></div>
  <div class="row"><label>City</label><input type="text" id="city"></div>
  <div class="row"><label>State</label><input type="text" id="state"></div>
  <div class="row"><label>ZIP</label><input type="text" id="zip_code"></div>
  <div class="row"><label>Country</label><input type="text" id="country"></div>

  <h2>Links</h2>
  <div class="row"><label>LinkedIn URL</label><input type="text" id="linkedin_url"></div>
  <div class="row"><label>Portfolio URL</label><input type="text" id="portfolio_url"></div>
  <div class="row"><label>GitHub URL</label><input type="text" id="github_url"></div>

  <h2>Work eligibility</h2>
  <div class="row"><label>Authorized to work in the US</label><input type="checkbox" id="work_authorized"></div>
  <div class="row"><label>Requires sponsorship</label><input type="checkbox" id="requires_sponsorship"></div>
  <div class="row"><label>Willing to relocate</label><input type="checkbox" id="willing_to_relocate"></div>

  <h2>Application logistics</h2>
  <div class="row"><label>Desired salary</label><input type="text" id="desired_salary"></div>
  <div class="row"><label>Earliest start date</label><input type="text" id="earliest_start_date"></div>
  <div class="row"><label>Notice period</label><input type="text" id="notice_period"></div>
  <div class="row"><label>How did you hear about us</label><input type="text" id="how_heard"></div>

  <h2>Optional self-identification (EEO)</h2>
  <div class="row"><label>Pronouns</label><input type="text" id="pronouns"></div>
  <div class="row"><label>Veteran status</label><input type="text" id="veteran_status"></div>
  <div class="row"><label>Disability status</label><input type="text" id="disability_status"></div>
  <div class="row"><label>Gender</label><input type="text" id="gender"></div>
  <div class="row"><label>Race / ethnicity</label><input type="text" id="race_ethnicity"></div>

  <button id="save">Save</button><span id="saveStatus"></span>
  <script src="options.js"></script>
</body>
</html>
