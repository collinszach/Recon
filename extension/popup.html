<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Recon Autofill</title>
  <style>
    body { width: 280px; font: 13px/1.4 -apple-system, sans-serif; margin: 0; padding: 12px; color: #222; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    #status { font-size: 12px; margin-bottom: 10px; padding: 6px 8px; border-radius: 6px; }
    #status.ok { background: #e6f7ee; color: #1a7f4b; }
    #status.err { background: #fdeaea; color: #b03030; }
    label { display: block; font-size: 11px; color: #666; margin: 6px 0 2px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 5px 6px; font-size: 12px; }
    button { width: 100%; margin-top: 10px; padding: 8px; font-size: 13px; cursor: pointer;
      background: #6c5ce7; color: #fff; border: none; border-radius: 6px; }
    button:disabled { opacity: .5; cursor: default; }
    .hint { font-size: 11px; color: #888; margin-top: 6px; }
    a { color: #6c5ce7; }
  </style>
</head>
<body>
  <h1>Recon Autofill</h1>
  <div id="status">checking connection…</div>

  <label for="company">Company (override)</label>
  <input type="text" id="company" placeholder="auto-detected if blank">
  <label for="title">Role title (override)</label>
  <input type="text" id="title" placeholder="auto-detected if blank">

  <button id="fill">Fill this page</button>
  <div class="hint">Highlights what it fills. Never submits the form — review before you send it.
    <a href="#" id="opts">Settings</a></div>
  <script src="popup.js"></script>
</body>
</html>
